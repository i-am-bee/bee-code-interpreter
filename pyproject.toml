[tool.poetry]
name = "bee-code-interpreter"
version = "0.0.29"
license = "Apache-2.0"
description = "Service intended as a backend for an LLM that can run arbitrary pieces of Python code."
authors = [ "Jan Pokorný <jan.pokorny@ibm.com>", "Tomáš Dvořák <tomas.dvorak@ibm.com>" ]
packages = [ { include = "code_interpreter", from = "src" } ]

[tool.poetry.dependencies]
python = "^3.12"

aiorun = "^2024.8.1"
anyio = "^4.6.2.post1"
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
tenacity = "^9.0.0"
httpx = "^0.27.2"
fastapi = "^0.115.2"
uvicorn = "^0.31.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
poethepoet = "^0.29.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks.run]
shell = "./scripts/run-build.sh"

[tool.poe.tasks.copyright]
cmd = "nwa add -l apache -c \"IBM Corp.\" scripts executor/{server.rs,Dockerfile} test src examples"

[tool.poe.tasks.test]
help = "Run tests"
shell = "pytest -v test"
